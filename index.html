
<!-- TAKE A PAUSE - 60 SECOND ACTIVITY -->
<div id="pausePopup" class="popup-overlay hidden"
     role="dialog" aria-modal="true"
     aria-labelledby="pauseTitle">

    <div class="popup-content wellness-popup">

        <button class="close-popup" type="button"
                data-close="pausePopup"
                aria-label="Close pause activity">×</button>

        <p class="small-heading">A MOMENT FOR YOURSELF</p>
        <h2 id="pauseTitle">🌿 Take a Pause</h2>

        <p>
            Take one gentle minute away from your busy day.
            You can stop whenever you want.
        </p>

        <div class="breathing-area">
            <div id="breathingCircle" class="breathing-circle">

                <span id="breathingInstruction">
                    Ready to pause?
                </span>

                <strong id="breathingCount"
                        role="timer"
                        aria-label="Seconds remaining">
                    60
                </strong>

            </div>
        </div>

        <p id="breathingStatus"
           class="wellness-status"
           role="status"
           aria-live="polite">
            Press Start whenever you're ready.
        </p>

        <div class="wellness-actions">

            <button id="startBreathing"
                    class="primary-button"
                    type="button">
                ▶ Start 60-Second Pause
            </button>

            <button id="stopBreathing"
                    class="secondary-button"
                    type="button">
                Stop
            </button>

            <button id="restartBreathing"
                    class="secondary-button"
                    type="button">
                ↻ Restart
            </button>

        </div>

        <p class="wellness-disclaimer">
            Breathe naturally and comfortably.
            Stop if you feel uncomfortable.
            This is a general wellness activity.
        </p>

    </div>
</div>
